<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .box{
            
          margin: 30px;
          height: 50px;
          width: 100px;
          border: 3px solid black;
          border-radius: 10px;
          background-color: plum;  
          position: relative;
          top: 50px;
          left: 10px;
          font-style: italic;
          text-align: center;
          animation-name: ghumakkad;
          animation-duration: 2s;
          animation-timing-function: ease-in-out;
          animation-delay: 1s;

          animation-iteration-count: infinite;
          animation-direction: alternate-reverse;
          
          animation: ghumakkad 2s ease-in-out 1s infinite alternate-reverse ;
        }
        @keyframes ghumakkad {
            0%{left: 10px;}
            50%{left: 50px;}
            60%{left: 160px;}
            100%{left: 200px;}
            
        }
    </style>
</head>
<body>
    <div class="box">Animation</div>
</body>
</html>
