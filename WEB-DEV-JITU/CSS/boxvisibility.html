<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
   
    <style>
        .Box{
            height: 50px;
            width: 50px;
        }
        #box1{
            background-color: aqua;
            visibility: hidden;

        }
        #box2{
            background-color: brown;
            visibility: visible;
            text-align: center;
        }
        #decoration{
            height: 50px;
            width: 100px;
           color: bisque; background-color: rebeccapurple;
           text-decoration: wavy;
           font-style: italic;
           text-align: center;
           font-family: Georgia, 'Times New Roman', Times, serif;
           
        }
        #text{
            height: 50px;
            width: 300px;
            color: aqua; background-color: black;
            text-decoration: line-through;
            text-decoration-color: rgb(225, 37, 235);
            font-size: 20px;
            font-weight: 500px;
            

        }
        
           
    </style>
</head>
<body>
    <div id="box1" class="Box"></div>
    <div id="box2" class="Box"><b>Jitu kumar</div><hr><br>
        <div id="decoration">Jitu kumar mandal</div><hr><br>
        <div id="text">
            Lorem, ipsum dolor.
        </div><hr><br>
        <div class="article">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Voluptatibus in minima culpa fugit neque quae aut veniam eaque dolorum voluptate.</div>
</body>
</html>
